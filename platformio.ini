; SALBAR Monorepo Root PlatformIO Configuration
; Target Gateway Board: LilyGO T3S3 SX1262 915MHz (ESP32-S3)

[platformio]
default_envs = t3s3_sx1262
src_dir = firmware/gateway/src
include_dir = firmware/gateway/src

[env:t3s3_sx1262]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1
    -I firmware/shared/include
    -I firmware/gateway/src

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    bblanchon/ArduinoJson @ ^7.0.4
